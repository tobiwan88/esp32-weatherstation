# Board profile: the facts the board-neutral hardware skills and hardware/calc/ scripts read.
# Skills never hard-code a number; it lives here, in critical.yaml or in parts/<MPN>.yaml.
# Status: pre-layout. No generators or KiCad files yet (hardware/reference/desk_notifier has a working example).
name: weatherstation-v1
pcb: weatherstation-v1.kicad_pcb
sch: weatherstation-v1.kicad_sch
bom: bom.csv
generators: {schematic: null, layout: null}   # to write: hardware/gen/weatherstation_v1.py, layout_v1.py (see hardware/PLAN.md)
notes: BOARD.md
requirements: REQUIREMENTS.md

fab:
  house: JLCPCB
  assembly: "JLCPCB PCBA, Economic (one side, SMT only); Standard if the quote forces it for the ESP32 module"
  rules: ../rules/jlc-4layer.json
  router_rules: ../rules/krt-fab.txt
  custom_drc: null            # to write: copy the rule set from reference/desk_notifier/notifier.kicad_dru and adapt
  extended_fee_usd: 3.07      # per unique non-preferred Extended part, Economic PCBA (jlcpcb.com/blog/reduce-pcb-assembly-cost-prototype, 2026-10)

# Requirement: 4 layers, two full ground planes (REQUIREMENTS.md 5). Dielectric/er numbers reused from the desk_notifier
# profile (jlcpcb.com/impedance, 2026-10); no impedance control ordered (no fast signals).
stackup:
  name: JLC04161H-7628
  copper_mm: 0.035
  soldermask: {thickness_mm: 0.015, er: 3.8}
  layers:
    - {name: F.Cu, role: signal, ref: In1.Cu, dielectric_mm: 0.2104, er: 4.4}
    - {name: In1.Cu, role: plane, net: GND}
    - {name: In2.Cu, role: plane, net: GND}
    - {name: B.Cu, role: signal, ref: In2.Cu, dielectric_mm: 0.2104, er: 4.4}

net_classes:
  Default: {track_mm: 0.2, clearance_mm: 0.15, via_mm: 0.6, drill_mm: 0.3}
  Power: {track_mm: 0.4, clearance_mm: 0.15, nets: [VBUS, VSYS, BAT, +3V3, 3V3_SW, SOLAR_IN, SOLAR_VCC, SW]}
  USB: {track_mm: 0.27, gap_mm: 0.15, nets: [/USB_DP, /USB_DN]}

layout:
  stitch_pitch_mm: [2, 3]
  thermal_relief: {spoke_mm: 0.3, gap_mm: 0.25, spokes: 4}
  max_board_mm: [50, 50]      # 4-layer boards under 50 x 50 mm are in JLCPCB's cheapest tier (community cost guide)

alternates:
  C2913198:
    - {lcsc: C2913204, note: "ESP32-S3-WROOM-1-N8R2 (adds 2 MB PSRAM): check the module's reserved GPIOs before reusing the pin map"}
  C3001973:
    - {lcsc: C129529, note: "SMBJ12A TVS, MCC: same footprint (SMB)"}

power: []   # switching-regulator inputs for calc/buck.py: none (buck-boost and charger ICs are checked in design:)
# Inputs of calc/power_budget.py. value null = MISSING, no source = WARN (unsourced). `source: assumption` = still a guess.
design:
  charger:                 # BQ25798 (C2876593): register values written by firmware before CE is released
    vreg_v: {value: 3.65, source: "CBAK 26700LT spec A/03: standard end of charge 3.65 V (charge-policy.md)"}
    vreg_accuracy_mv: {value: 35, source: "BQ25798 datasheet SLUSDV2C section 6.5: VREG_ACC -0.45 % to +0.95 % (specified at VREG 4.2 V; worst high 0.95 % x 3.65 V = 35 mV, not specified at 3.65 V)"}
    ichg_a: {value: 1.5, source: "0.38C of 3.9 Ah; inside the HY2112 charge overcurrent (-170 mV minimum): 2 x 48 mOhm x 1.5 A = 144 mV; 1.9 A would trip it (power_budget check). Panel supplies about 1 A anyway"}
  hy2112:                  # HY2112-CB protection (U6) and its pack-negative FETs M60/M61
    fet_rds_ohm: {value: 0.048, source: "AO3400A (C20917) JLCPCB listing: 48 mOhm at 2.5 V gate; worst case used"}
    oc_charge_v: {value: 0.170, source: "HY2112-CB table 1 / section 9: charge overcurrent -200 mV +/- 30 mV, minimum magnitude 170 mV"}
    oc_discharge_v: {value: 0.185, source: "HY2112-CB section 9: discharge overcurrent 200 mV +/- 15 mV, minimum 185 mV"}
  cell:                    # CBAK 26700LT spec A/03 (LFP). Cold charging is firmware-managed (charge-policy.md).
    vmax_v: {value: 3.75, source: "CBAK 26700LT spec A/03: limited charge voltage 3.75 V (upper limit 3.8 V)"}
    cell_mah: {value: 3900, source: "CBAK 26700LT spec A/03: minimum capacity 3900 mAh (typical 4000)"}
    vcut_cell_v: {value: 2.0, source: "CBAK 26700LT spec A/03: standard discharge cut-off 2.0 V (must not exceed the HY2112 2.10 V detection)"}
    hy2112_overdischarge_v: {value: 2.10, source: "HY2112-CB datasheet DS-HY2112 V08 table 1: overdischarge detection 2.10 V"}
    vcutoff_firmware_v: {value: 2.4, source: "firmware policy: sensors off above the HY2112 detection (2.10 V) so the protection never acts on a normal load"}
  buckboost:               # TPS63802 (3.3 V), see cells.md and BOARD.md power review
    vin_min_v: {value: 1.3, source: "TPS63802 datasheet table 8.3: input voltage 1.3 V minimum (1.8 V to start)"}
    vout_v: 3.3
    path_r_ohm: {value: 0.15, source: "assumption: F1 PTC (about 40 mOhm) + M60/M61 AO3400A (about 35 mOhm each) + wiring"}
  panel:
    vmp_v: {value: 6.0, source: "assumption: 6 V class panels list Vmp 5.76-6.12 V (distributor listings, scratchpad panel.md); replace with the bought panel's datasheet value"}
  load:
    peak_a: {value: 0.35, source: "SEN66 datasheet Table 12: peak supply current 300 mA typ, 350 mA max (measurement, 2 ms pulses)"}
    sensor_vmin_v: {value: 3.15, source: "SEN66 datasheet Table 12 + footnote 25: 3.15 V minimum incl. ripple, 3.3 V typ, 3.6 V max"}
  cycle:
    period_s: {value: 600, source: assumption}
    esp_active_s: {value: 15, source: assumption}
    esp_active_ma: {value: 100, source: assumption}
    sen66_on_s: {value: 45, source: "assumption: SEN66 datasheet Table 2 PM start-up 30 s, plus margin for the 60 s average-current window"}
    sen66_ma: {value: 110, source: "SEN66 datasheet Table 12: measurement mode average after first 60 s, 90 mA typ, 110 mA max (used: max)"}
    sleep_ua: {value: 100, source: assumption}          # TPS63802 Iq 11 uA + HY2112 3 uA + module + dividers
  solar:
    panel_w: {value: 10, source: "decision 2026-11-01: 6 V class, about 10 W (e.g. Voltaic P110 9.5 W, or 2 x 6 V 5 W in parallel). Covers 0.96 Wh/day from 0.16 peak-sun hours, 1.5x margin from 0.24 h; replace with the bought panel's datasheet"}
    psh_worst_h: {value: 0.7, source: "design value for cloudy December, Germany. PVGIS-SARAH3 2005-2023, 45 deg: Dec mean 1.25 kWh/m2/d Frankfurt, 0.95 Hamburg; 27 % (Frankfurt) to 44 % (Hamburg) of Dec days below 0.5"}  # peak-sun hours per day
    system_eff: {value: 0.6, source: assumption}
