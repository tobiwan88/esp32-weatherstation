checklist:
  - "CE must not float (pull high or low): the pull-up is on the main board, power board alone floats CE (power-board/PARTS-REVIEW.md A1)"
  - "INT pull-up to the host rail, not REGN: R22 to +3V3 on the main board (7.3.11.2)"
  - "HVDCP stays disabled (EN_HVDCP = 0 default, 7.3.4.5.2): 9/12 V on USB_VBUS would exceed the USBLC6 VBR 6 V on the main board"
  - "D+/D- reach the pins over J10 (USB_DP/USB_DN): BC1.2 decision in hardware/ARCHITECTURE.md"
  - "external caps per table 5-1 (VBUS, PMID, SYS, BAT, BTST, REGN): carried over from weatherstation-v1, reviewed there"
  - "watchdog expiry restores POR registers (VREG 4.2 V): firmware rule, weatherstation-v1/PARTS-REVIEW.md B3"
