# Board profile: the facts the board-neutral hardware skills and hardware/calc/ scripts read (hw-base folder contract).
# Status: schematic generated (split from weatherstation-v1, 2026-11-21); placed and routed (2026-11-22, BOARD.md).
name: main-board
pcb: main-board.kicad_pcb         # routed: tools/route_main.sh (placement + hand copper: tools/build_board.sh main-board)
sch: main-board.kicad_sch
bom: bom.csv
generators: {schematic: ../gen/main_board.py, layout: ../gen/main_pcb.py}   # gen/main_layout.py is the schematic block layout; gen/pcbkit.py + gen/stack.py shared
notes: BOARD.md
requirements: ../REQUIREMENTS-system.md
architecture: ../ARCHITECTURE.md

fab:
  house: JLCPCB
  assembly: "JLCPCB PCBA, Economic (one side, SMT only); J2, J7, J8 and J10 hand-soldered"
  rules: ../rules/jlc-4layer.json
  extended_fee_usd: 3.07      # REQUIREMENTS-system.md section 2 (JLC fee table 2026-10-22)
  setup_fee_usd: 8.18
  stencil_fee_usd: 1.53
  order_qty: 5
  order_limit_usd: 100

stackup:                      # as weatherstation-v1 (REQUIREMENTS-system.md section 3: 4 layers, In1/In2 GND)
  name: JLC04161H-7628
  copper_mm: 0.035
  soldermask: {thickness_mm: 0.015, er: 3.8}
  layers:
    - {name: F.Cu, role: signal, ref: In1.Cu, dielectric_mm: 0.2104, er: 4.4}
    - {name: In1.Cu, role: plane, net: GND}
    - {name: In2.Cu, role: plane, net: GND}
    - {name: B.Cu, role: signal, ref: In2.Cu, dielectric_mm: 0.2104, er: 4.4}

net_classes:
  Default: {track_mm: 0.2, clearance_mm: 0.15, via_mm: 0.6, drill_mm: 0.3}
  # SYS from J10 to U2/U7: peak load 0.6 A at the cell; USB_VBUS J1 -> J10 carries the USB charge input (ILIM 1.59 A)
  Power: {track_mm: 0.65, clearance_mm: 0.15, via_mm: 0.6, drill_mm: 0.3, current_a: 1.7,
          nets: [SYS, USB_VBUS, 5V_SW, /Rails/BUCK_L1, /Rails/BUCK_L2, /Rails/BOOST_SW]}
  # +3V3 (ESP32 TX bursts about 0.4 A plus sensors) and 3V3_SW (sensors, 5 mA typical; inrush limited by the R76/C48 ramp)
  Rail: {track_mm: 0.3, clearance_mm: 0.15, via_mm: 0.6, drill_mm: 0.3, current_a: 0.6, nets: [+3V3, 3V3_SW]}
  # 90.6 ohm diff with mask (calc/impedance.py), full speed. clearance 0.6 mm = the spacing to every other net's tracks
  # and vias (> 2 x the width); the pair's own gap and pads (connector pitch) are custom rules in rules/main-board.kicad_dru
  USB: {track_mm: 0.27, gap_mm: 0.15, clearance_mm: 0.6, nets: [/USB_DP, /USB_DN]}

layout:
  stitch_pitch_mm: [2, 3]
  thermal_relief: {spoke_mm: 0.3, gap_mm: 0.25, spokes: 4}
  max_board_mm: [50, 50]
  temp_rise_c: 10

alternates:
  C2913198:
    - {lcsc: C2913204, note: "ESP32-S3-WROOM-1-N8R2 (adds 2 MB PSRAM): check the module's reserved GPIOs before reusing the pin map"}

power: []   # no plain buck (calc/buck.py); the TPS63802 is checked in design: below
# Inputs of calc/power_budget.py for the parts on this board. Charger, cell protection and the energy budget are checked
# on the power board (power-board/board.yaml), whose cycle: inputs describe this board's load.
design:
  buckboost:               # TPS63802 (U2), 3.3 V from SYS
    vin_min_v: {value: 1.3, source: "TPS63802 datasheet table 8.3: input voltage 1.3 V minimum (1.8 V to start)"}
    vout_v: 3.3
    path_r_ohm: {value: 0.17, source: "assumption: v1 0.15 ohm (F1 PTC + M60/M61 + wiring) + J10 2 SYS pins and 2 GND pins in parallel (about 20 mOhm round trip)"}
  cell:
    vcutoff_firmware_v: {value: 2.4, source: "firmware policy (power-board/board.yaml): sensors off above the HY2112 detection 2.10 V"}
  load:
    peak_a: {value: 0.6, source: "estimate: ESP32 TX about 0.4 A + PMS7003 0.19 A at the cell (PMS7003 manual V2.5: active <= 100 mA at 5 V)"}
    sensor_vmin_v: {value: 2.4, source: "SCD4x datasheet v1.7 table 4: VDD 2.4-5.5 V (SHT45 1.08-3.6 V); 3V3_SW is 3.32 V"}
  i2c_bus:                 # sensor bus SEN_SDA/SEN_SCL (IO13/IO14), checked by calc/i2c_bus.py
    vdd_v: {value: 3.3, source: "3V3_SW from the TPS63802 (3.32 V)"}
    pullup_ohm: {value: 2200, source: "R50/R51 (I2C sheet), 2.2k since phase B (was 10k: rise time 2.3 us with 2 m of cable)"}
    freq_khz: {value: 100, source: "firmware choice: standard mode for the outdoor cable"}
    pcb_pf: {value: 20, source: "assumption: about 10 cm of trace on 4 layers plus 4 connector pads"}
    cable_pf_per_m: {value: 100, source: "assumption: unshielded 4-core cable or Qwiic flex, 50-100 pF/m class; measure the bought cable"}
    cable_m: {value: 2, source: "assumption: SHT head in its radiation shield up to 2 m from the enclosure (one Qwiic cable)"}
    devices_pf:
      value: {U1: 2, U5: 3.5, U9_BMP580: 10, U8_SCD41: 10, SHT_head: 10, SEN0460: 10, qwiic_module: 10}
      source: "ESP32-S3-WROOM-1 v1.8 table 6-3 CIN 2 pF; USBLC6-2 DS4260 Rev 7 3.5 pF max; sensors not stated: NXP UM10204 table 10 Ci max 10 pF"
    module_pullups_ohm: {value: [2200], source: "one bought Qwiic module with its 2.2k pull-ups enabled (SparkFun boards ship 2.2k or 4.7k, community.sparkfun.com Qwiic pull-up threads)"}
  pulse_port:              # J12 rain gauge + anemometer reed contacts (IO15, IO16), checked by calc/i2c_bus.py
    vdd_v: {value: 3.3, source: "+3V3 (always on: the ULP counts in deep sleep)"}
    pullup_ohm: {value: 1000000, source: "R70/R71 1M (C26083 Basic)"}
    cap_f: {value: 4.7e-9, source: "C70/C71 4.7 nF (C1538 Basic) at the GPIO behind the 1k series R72/R73"}
    inputs: {value: 2, source: "rain + wind contacts; worst case both resting closed"}
    sleep_budget_ua: {value: 100, source: "REQUIREMENTS-system.md section 4: whole-stack sleep under 100 uA"}
    max_rate_hz: {value: 42, source: "assumption: SparkFun SEN-15901 weather meter class, 2.4 km/h per contact closure per second; 100 km/h = 42 Hz"}
  rail_switch:             # Q40 3V3_SW high-side switch with the R76/C48 ramp (review A3), checked by calc/rail_switch.py
    v_rail: {value: 3.32, source: "+3V3 from the TPS63802 divider 220k/39k (Rails sheet)"}
    rs_ohm: {value: 10000, source: "R76 10k (C25744), Q41 drain to the Q40 gate node; 2N7002 on-resistance (ohms) neglected"}
    rpu_ohm: {value: 100000, source: "R40 100k gate pull-up to +3V3"}
    r_bleed_ohm: {value: 22000, source: "R78 22k (C25768 Basic) 3V3_SW to GND, review follow-up B1 2026-11-21"}
    cgd_ext_f: {value: 2.2e-8, source: "C48 22 nF X7R 50 V 0402 (C1532 Basic), gate to drain"}
    crss_f: {value: 5.5e-11, source: "AO3401A Rev 3.1 electrical table: Crss 55 pF typ"}
    ciss_f: {value: 6.45e-10, source: "AO3401A Rev 3.1 electrical table: Ciss 645 pF typ"}
    vth_v: {value: [0.5, 0.9, 1.3], source: "AO3401A Rev 3.1: VGS(th) -0.5 min, -0.9 typ, -1.3 max (magnitudes)"}
    gfs_s: {value: 17, source: "AO3401A Rev 3.1: gFS 17 S at VDS -5 V, ID -4 A (square-law K derived from it)"}
    gfs_id_a: {value: 4.0, source: "AO3401A Rev 3.1: gFS test current 4 A"}
    vgs_rds_spec_v: {value: 2.5, source: "AO3401A Rev 3.1: RDS(on) 85 mOhm max specified at VGS -2.5 V"}
    c_load_eff_f: {value: 2.86e-5, source: "assumption: C42 + C43 22 uF 25 V X5R 0805 (C45783) at 60 % under 3.3 V DC bias = 26.4 uF, C90/C91 0.2 uF, 2 uF for bought Qwiic modules on J4/J11; C47 not fitted; the SHT head sits behind R77 100 ohm"}
    c_load_nom_f: {value: 4.62e-5, source: "C42 + C43 nominal 44 uF + 0.2 uF + 2 uF modules (worst case for inrush)"}
    c_rail_eff_f: {value: 2.84e-5, source: "assumption: +3V3 caps C41 + C30 22 uF at 60 % = 26.4 uF + C31/C32/C33 about 2 uF"}
    v_min_mcu: {value: 3.0, source: "ESP32-S3-WROOM-1 v1.8 table 6-2 (recommended operating conditions): VDD33 3.0 V minimum"}
    dip_ref_v: {value: 0.106, source: "TPS63802 SLVSEU9D figure 10-22 (buck-boost, VI 3.3 V, 0.1 -> 1 A load step, 1 us edge): cursor dip 106 mV"}
    dip_ref_step_a: {value: 0.9, source: "TPS63802 SLVSEU9D figure 10-22: 0.1 A to 1 A step"}
    inrush_max_a: {value: 0.9, source: "TPS63802 SLVSEU9D figure 10-22: the load step the datasheet shows (0.9 A); the dip scaling is only trusted inside it"}
  cable_feed:              # R77 in the J3 supply (outdoor SHT cable, review B11), checked by calc/rail_switch.py
    r_ohm: {value: 100, source: "R77 100 ohm 1206 (C17901 Basic)"}
    p_rated_w: {value: 0.25, source: "C17901 LCSC listing: 250 mW (1206 thick film)"}
    i_load_max_a: {value: 0.002, source: "SHT4x datasheet V7.3 4.5: 500 uA max while measuring (heater off; heater forbidden) plus 1.5 mA for one more low-power sensor chained on the head"}
    drop_max_v: {value: 0.3, source: "remote sensor I/O limit VDD + 0.3 V with the bus pull-ups on the main board at 3.3 V"}
  leds:                    # status LEDs D10/D11 (side view, main-board edge), checked by calc/led_current.py; awake only
    status:
      refs: [D10, D11, R34, R35]
      v_drive: {value: 3.3, source: "IO41/IO42 high at +3V3 (TPS63802 3.32 V; VOH drop at 1-2 mA neglected)"}
      r_ohm: {value: 1000, source: "R34/R35 1k (C11702 Basic)"}
      vf_low_v: {value: 1.75, source: "LTST-S270KRKT DS22-2000-210 rev G page 6 fig. 2: VF about 1.75 V near 1 mA (read off the curve)"}
      vf_max_v: {value: 2.4, source: "LTST-S270KRKT DS22-2000-210 rev G page 4: VF max 2.4 V at 20 mA (upper bound at 1-2 mA)"}
      if_test_ma: {value: 20, source: "LTST-S270KRKT page 4: IV test current"}
      if_max_ma: {value: 30, source: "LTST-S270KRKT page 2: DC forward current 30 mA"}
      gpio_max_ma: {value: 20, source: "ESP32-S3 default GPIO drive strength 20 mA (UNVERIFIED: not in parts/ESP32-S3-WROOM-1.yaml)"}
      i_min_ma: {value: 0.5, source: "design choice: below about 0.5 mA a 18 mcd-bin part is hard to see indoors"}
      iv_typ_mcd: {value: 54, source: "LTST-S270KRKT page 4: IV 54 mcd typ at 20 mA"}
      iv_min_mcd: {value: 18, source: "LTST-S270KRKT page 4 / page 5 bin M: IV 18 mcd min at 20 mA (fig. 4 about linear below 20 mA)"}
